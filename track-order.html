<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track a Knots & Bloom order request."><title>Order tracking | Knots & Bloom</title><link rel="stylesheet" href="./style.css"><script src="./script.js" defer></script></head><body data-page="tracking"><div id="site-header"></div><main class="page-main"><section class="page-hero"><p class="eyebrow">A little update</p><h1>Order tracking</h1><p>Order requests from this demo are saved only in the browser where they were submitted.</p></section><section class="container page-content" style="max-width:650px"><div class="admin-panel"><label for="track-number">Order reference</label><input id="track-number" type="text" placeholder="KB-12345678"><button class="button button-dark" id="track-button" type="button">Look up request</button><p id="track-result" role="status"></p></div></section></main><div id="site-footer"></div><script>document.getElementById('track-button')?.addEventListener('click',()=>{const n=document.getElementById('track-number').value.trim(),orders=JSON.parse(localStorage.getItem('kb-orders')||'[]'),o=orders.find(x=>x.number===n);document.getElementById('track-result').textContent=o?`${o.number}: ${o.status}. Payment: ${o.paymentStatus}. This lookup is local to this browser.`:'No matching order request found in this browser.'})</script></body></html>
