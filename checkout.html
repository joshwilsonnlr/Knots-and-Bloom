<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Send an order request for your Knots & Bloom crochet favorites."><title>Order request | Knots & Bloom</title><link rel="stylesheet" href="./style.css"><script src="./script.js" defer></script></head><body data-page="checkout"><div id="site-header"></div><main class="page-main"><section class="page-hero"><p class="eyebrow">Almost yours</p><h1>Let's make it official</h1><p>Share your details and we'll confirm availability, shipping, and payment with you.</p></section><section class="container page-content checkout-layout"><form id="checkout-form" class="admin-panel"><h2 style="font:500 29px var(--serif);color:var(--brown);margin-top:0">Your details</h2><div class="form-grid"><label>Name<input name="name" type="text" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone (optional)<input name="phone" type="tel" autocomplete="tel"></label><label>Country / region<input name="country" type="text" autocomplete="country-name" required></label><label class="full">Shipping address<input name="address" type="text" autocomplete="street-address" required></label><label>City<input name="city" type="text" autocomplete="address-level2" required></label><label>Postal code<input name="postal" type="text" autocomplete="postal-code"></label><label class="full">A note for the maker (optional)<textarea name="notes" rows="3"></textarea></label></div><p style="font-size:10px;color:var(--muted)">Submitting creates an unpaid order request saved in this browser. It does not process a payment or transmit your information to a server.</p><button class="button button-dark" type="submit">Send order request ↗</button></form><aside class="order-summary"><h2 style="font:500 28px var(--serif);color:var(--brown);margin-top:0">Order summary</h2><div id="checkout-summary"></div></aside></section></main><div id="site-footer"></div></body></html>
